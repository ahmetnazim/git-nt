name: Release git-nt

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MAX_BINARY_BYTES: "6291456" # 6 MiB hard ceiling

jobs:
  build-release-artifacts:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build zero-C release binary
        env:
          CC: /bin/false
          CXX: /bin/false
        run: cargo build --release --locked --bin git-nt --target ${{ matrix.target }}

      - name: Enforce < 6 MiB size ceiling and package tarball
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/git-nt"
          test -f "$BIN"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            SIZE_BYTES=$(stat -c%s "$BIN")
          else
            SIZE_BYTES=$(stat -f%z "$BIN")
          fi
          echo "Release binary size (${{ matrix.target }}): ${SIZE_BYTES} bytes"
          if [ "$SIZE_BYTES" -ge "$MAX_BINARY_BYTES" ]; then
            echo "::error::Binary size ${SIZE_BYTES} exceeds ${MAX_BINARY_BYTES} ceiling."
            exit 1
          fi

          TAG="${GITHUB_REF_NAME:-dev}"
          ARCHIVE="git-nt-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist/stage
          cp "$BIN" LICENSE README.md dist/stage/
          tar -C dist/stage -czf "dist/${ARCHIVE}" git-nt LICENSE README.md
          rm -rf dist/stage

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release with tarballs & checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "git-nt ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
