[workspace]
resolver = "3"
members = [
  "crates/nt-core",
  "crates/nt-read",
  "crates/nt-write",
  "crates/nt-mcp",
  "crates/git-nt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/ahmetnazim/git-nt"
homepage = "https://github.com/ahmetnazim/git-nt"
description = "Pure-Rust Negative-Space memory and prompt-injection-hardened context hydration for Git"
keywords = ["git", "mcp", "ai-agents", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

nt-core = { path = "crates/nt-core" }
nt-read = { path = "crates/nt-read" }
nt-write = { path = "crates/nt-write" }
nt-mcp = { path = "crates/nt-mcp" }

[profile.release]
opt-level = "z"       # Optimize aggressively for compact binary footprint (< 3 MiB target, < 6 MiB ceiling)
lto = "fat"           # Full cross-crate dead-code elimination
codegen-units = 1     # Maximum LTO/size optimization
strip = "symbols"     # Strip debug info and symbol tables from target/release/git-nt
panic = "abort"       # Removes unwinding tables (~10-15% smaller binary)
